name: funding-rate-alert

on:
  schedule:
    # 每 5 分钟一次(GitHub 高峰期可能延迟几分钟, 不保证精确)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}      # 支持手动触发测试

# 允许 workflow 把 state.json 提交回仓库
permissions:
  contents: write

# 避免上一轮还没跑完又触发, 导致提交冲突
concurrency:
  group: funding-rate-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update funding state [skip ci]"
            git push
          else
            echo "state.json 无变化, 跳过提交。"
          fi

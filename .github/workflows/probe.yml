name: probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe binance.vision futures paths
        run: |
          for P in "/fapi/v1/premiumIndex" "/fapi/v1/fundingInfo" "/futures/data/..." "/api/v3/time"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://data-api.binance.vision$P" 2>/dev/null || echo ERR)
            echo "data-api.binance.vision$P -> $CODE"
          done
          echo "--- 直接看 premiumIndex 内容前300字符 ---"
          curl -s --max-time 15 "https://data-api.binance.vision/fapi/v1/premiumIndex?symbol=BTCUSDT" | head -c 300
          echo ""
          echo "--- fundingInfo 前300 ---"
          curl -s --max-time 15 "https://data-api.binance.vision/fapi/v1/fundingInfo" | head -c 300
